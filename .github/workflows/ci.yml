name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: npm test

      - name: Check that every module loads
        run: |
          node -e "import('./lib/index.js').then((m) => { if (typeof m.apply !== 'function' || typeof m.name !== 'string') { throw new Error('bad host entry'); } })"
          node -e "import('./lib/entry-config.js').then((m) => { if (typeof m.resolvePatchFile !== 'function') { throw new Error('bad entry-config'); } })"
